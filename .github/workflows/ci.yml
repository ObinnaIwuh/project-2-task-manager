name: Task Manager CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/obinnaiwuh/task-manager-backend:latest
            ghcr.io/obinnaiwuh/task-manager-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/obinnaiwuh/task-manager-frontend:latest
            ghcr.io/obinnaiwuh/task-manager-frontend:${{ github.sha }}


  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            cd ~/task-manager

            export IMAGE_TAG=${{ github.sha }}

            echo "Deploying version: $IMAGE_TAG"

            echo "Pulling Docker images..."
            docker compose pull

            echo "Starting updated containers..."
            docker compose up -d

            echo "Waiting for services..."
            sleep 10

            echo "Checking container status..."
            docker compose ps

            echo "Checking application health..."
            curl --fail http://localhost:8080/api/health

            echo "Deployment successful!"
            echo "Running version: $IMAGE_TAG"